name: RPDev-Feed-Modules CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate Module Catalog JSON
      run: |
        python3 -c "import json; data=json.load(open('catalog/modules.json')); print(f'Valid catalog with {len(data.get(\"modules\", []))} modules')"

    - name: Build with Gradle
      run: ./gradlew assemble --no-daemon
