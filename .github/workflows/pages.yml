name: Deploy Module Catalog to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'catalog/**'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage Catalog into Public Web Root
        run: |
          mkdir -p public/catalog
          cp catalog/modules.json public/catalog/modules.json
          echo "repo.feed.iamrp.dev" > public/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
